name: Test Pipeline
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  init:
    name: initialize
    runs-on: ubuntu-24.04-arm
    steps:

      - name: Checkout
        uses: codebeltnet/git-checkout@v1

      - name: Install .NET
        uses: codebeltnet/install-dotnet@v3
        with:
          includePreview: true

      - name: Run test
        shell: bash
        run: |
          dotnet test test/Cuemon.AspNetCore.Authentication.Tests/Cuemon.AspNetCore.Authentication.Tests.csproj --framework net11.0 --configuration Debug --results-directory /tmp/cuemon-results --blame --blame-hang --blame-hang-timeout 45s

      - name: Upload activation artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dumps
          include-hidden-files: true
          path: |
            /tmp/cuemon-results/**/*.dmp
          if-no-files-found: ignore
